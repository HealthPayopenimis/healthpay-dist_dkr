# HealthPay Payer System — Release Manifest
# Trial: trial-1 | Baseline: openIMIS release/26.04 | Slice: 1 (core payer flow)
# Gate M rule: every dependency in the generated build context MUST resolve to exactly
# these commits. file: paths, github.com/openimis/ URLs, and branch refs in generated
# manifests are build failures. This file is regenerated and diffed post context-generation.
release: hp-26.04-slice1-trial1
baseline: openimis-release-26.04
database_strategy: legacy-bootstrap-then-real-migrations   # AMENDED at Gate I4 (see bootstrap/README.md):
#   local rehearsal proved the 26.04 migration graph is not self-sufficient on empty PG
#   (39 managed=False tables, 33 required views, system-role data dependencies).
#   bootstrap/ (this repo) runs ONCE pre-migrate per fresh DB. Still BANNED: --fake-initial,
#   and django_migrations as schema evidence — script/schema_audit.py remains sole arbiter.
compose_authoritative: compose.healthpay.yml   # stock compose.yml set is NOT used at trial-1 (local db + auto-migrations + opensearch contradict Slice 1)
schema_audit: healthpay-be_py/script/schema_audit.py   # Gate I4 evaluator; run per its header docstring
browser_gates: cypress/e2e/healthpay-gates.cy.js   # A1-A7 against the COMPILED BUNDLE (plan v3 §5:
#   API-level evidence is insufficient for A2 — the previous trial's defect was a bundle that never
#   requested  while the backend returned it correctly).
component_count: 37   # authoritative (earlier commit message said 38 in error)
modules_disabled_slice1: [social_protection, calcrule_social_protection, calcrule_timesheet, opensearch_reports, deduplication, payroll, grievance_social_protection, claim_sampling, api_etl, dhis2_etl, calcrule_validations, payment_cycle, individual, workflow]
# Gate I1 amendment (import-graph scan of all retained modules at their pinned refs):
#   calcrule_validations -> social_protection (top-level), payment_cycle -> payroll (top-level),
#   individual -> opensearch_reports (top-level), workflow -> individual (top-level).
#   All four dropped; reverse scan confirmed nothing retained imports any of them
#   (tasks_management self-contained). This corrects the earlier rationale which
#   assumed individual/workflow were required by retained modules.
# Dependency-driven decisions (differs from the v3 draft): invoice, calculation, contribution_plan,
# policyholder, contract, payment_cycle, individual, workflow and the calcrule set are RETAINED even
# though outside the Slice-1 acceptance path, because retained modules import from them
# (e.g. calcrule_third_party_payment -> invoice). Under the empty-DB real-migrations strategy their
# tables are created correctly, which eliminates the incident's silent-guard risk (§3.7).
sourcing_allowlist:
  # Incident §5.1 permits deliberately retained upstream references with a documented reason.
  - rule: modules NOT among the 16 forked pins may resolve as exact-version upstream artifacts
    reason: identical upstream code at the 26.04 baseline; private-registry republication is Slice-2 hardening
    applies: exact PyPI pins (openimis-be-X==vN) and exact npm pins (@openimis/fe-X@vN)
  - rule: transitive @openimis/* npm and openimis-be-* pip dependencies of pinned modules may resolve from public registries
    reason: module repos' own package manifests still declare upstream names at trial-1
  - forbidden: any 'file:' path, any branch ref, any '>=' or '^' range in generated manifests
