# HealthPay Payer System — trial-1 compose (plan v3 authoritative)
#
# SELF-CONTAINED: run with `docker compose -f compose.healthpay.yml ...` ONLY.
# Do NOT stack with compose.yml / compose.base.yml — the stock set contradicts
# plan v3: it bundles a local legacy-bootstrap `db` container, an auto-running
# `migrations` service, and the OpenSearch overlay, all of which Slice 1 forbids.
#
# Deliberate differences from stock (each maps to a v3 rule):
#   - NO `db` service .............. DO Managed PostgreSQL only (§4)
#   - NO `migrations` service ...... migrations are an explicit release step (§4.4):
#         docker compose -f compose.healthpay.yml run --rm backend manage migrate
#     (take a DB snapshot immediately before; DJANGO_MIGRATE=False stays set)
#   - NO OpenSearch / cache ........ outside Slice-1 acceptance surface (§3)
#   - Images by DOCR digest ........ immutable pins recorded at Gate I1 (§2)
#   - DB_OPTIONS sslmode=require ... Managed PG enforces SSL (issue #3, v2 table)
#   - certbot: initial issuance path exists (profile `issue`), renewal separate —
#     stock ships renewal-only, commented out (incident issue #1)
#
# First-boot TLS bootstrap (Gate I3) — run steps 2-3 back-to-back; do NOT
# restart the frontend between them (a restart re-plants the self-signed
# placeholder if issuance hasn't completed):
#   1. docker compose -f compose.healthpay.yml up -d frontend   # serves HTTP + webroot
#   2. docker compose -f compose.healthpay.yml --profile issue run --rm certbot-issue
#      (certbot-issue auto-moves the entrypoint's self-signed placeholder aside
#       and scrubs stale renewal artifacts before certonly; safe to re-run)
#   3. docker compose -f compose.healthpay.yml exec frontend nginx -s reload
#   4. docker compose -f compose.healthpay.yml --profile renew up -d certbot-renew

x-api: &default-api
  image: ${BE_IMAGE:?set BE_IMAGE to registry.digitalocean.com/<reg>/backend@sha256:...}
  environment:
    - DB_DEFAULT=postgresql
    - DB_HOST=${DB_HOST:?}
    - DB_PORT=${DB_PORT:-25060}
    - DB_NAME=${DB_NAME:?}
    - DB_USER=${DB_USER:?}
    - DB_PASSWORD=${DB_PASSWORD:?}
    - DB_OPTIONS=${DB_OPTIONS:-{"sslmode":"require"}}
    - SITE_ROOT=api
    - SITE_URL=${DOMAIN:?}
    - CELERY_BROKER_URL=amqp://rabbitmq
    - MODE=${MODE:-Prod}
    - HOSTS=${HOSTS:?}
    - DJANGO_MIGRATE=False
    - DJANGO_LOG_LEVEL=${DJANGO_LOG_LEVEL:-WARNING}
    - DJANGO_LOG_HANDLER=console
  volumes:
    - photos:/openimis-be/openIMIS/images/insurees
  networks:
    healthpay-net:
  restart: always
  logging: &default-logging
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:
  frontend:
    image: ${FE_IMAGE:?set FE_IMAGE to registry.digitalocean.com/<reg>/frontend@sha256:...}
    restart: always
    environment:
      - REACT_APP_API_URL=api
      - NEW_OPENIMIS_HOST=${DOMAIN}
      - OPENIMIS_CONF_JSON=${OPENIMIS_FE_CONF_JSON:-}
    networks:
      healthpay-net:
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      - backend
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      - ./conf/nginx-healthpay:/conf/
    logging: *default-logging

  backend:
    <<: *default-api
    command: start
    depends_on:
      rabbitmq:
        condition: service_started

  worker:
    <<: *default-api
    command: worker
    depends_on:
      rabbitmq:
        condition: service_started
    deploy:
      mode: replicated
      replicas: ${WORKER_REPLICAS:-3}

  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    networks:
      healthpay-net:
    logging: *default-logging

  # --- TLS ------------------------------------------------------------------
  certbot-issue:
    profiles: ["issue"]
    image: certbot/certbot
    # The frontend entrypoint pre-populates live/${DOMAIN} with a self-signed
    # placeholder (CN=localhost) whenever the real cert is missing, and certbot
    # refuses to write into a live/ lineage it does not own. Detection rule:
    # live/ dir present WITHOUT a non-empty renewal/<domain>.conf = not
    # certbot-managed -> move it aside (timestamped) and scrub stale 0-byte
    # renewal configs / empty archive dirs from prior failed runs, then issue.
    # Idempotent: once a real lineage exists (non-empty renewal conf), the
    # move-aside is skipped and certonly is a no-op/renewal.
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        D=/etc/letsencrypt
        DOM="${DOMAIN}"
        if [ -d "$$D/live/$$DOM" ] && [ ! -s "$$D/renewal/$$DOM.conf" ]; then
          TS=$$(date +%s)
          echo "[issue] moving aside non-certbot placeholder live/$$DOM -> live/$$DOM.placeholder.$$TS"
          mv "$$D/live/$$DOM" "$$D/live/$$DOM.placeholder.$$TS"
          rm -f "$$D/renewal/$$DOM.conf"
          [ -d "$$D/archive/$$DOM" ] && rmdir "$$D/archive/$$DOM" 2>/dev/null || true
        fi
        exec certbot certonly --webroot -w /var/www/certbot \
          -d "$$DOM" --email "${CERTBOT_EMAIL:?}" --agree-tos --no-eff-email \
          ${CERTBOT_EXTRA_ARGS:-}
    environment:
      - DOMAIN=${DOMAIN:?}
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot

  certbot-renew:
    profiles: ["renew"]
    image: certbot/certbot
    restart: always
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot

networks:
  healthpay-net:
    name: "${PROJECT_NAME:-healthpay}-net"

volumes:
  photos:
